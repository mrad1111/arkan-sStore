[project]
name = "mysite"
version = "0.1.0"
description = "ARKAN Store Django Project"
requires-python = ">=3.12"
dependencies = [
    "Django==6.0.6",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.1",
    "django-jazzmin>=3.0.5",
    "Pillow>=10.0.0",
]

[tool.uv]
package = false

[tool.pyrefly]
disabled_rules = [
    "bad-override-mutable-attribute",
    "bad-argument-type"
]
